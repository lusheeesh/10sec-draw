<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>10-Second Drawing Challenge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #f0fdf4;
            background-image: radial-gradient(#bbf7d0 1px, transparent 1px);
            background-size: 20px 20px;
            overscroll-behavior-y: contain;
            min-height: 100vh;
            overflow-x: hidden;
            overflow-y: auto;
        }
        html {
            min-height: 100%;
            overflow-y: auto;
            scroll-behavior: smooth;
        }
        main {
            padding-bottom: 70px;
        }
        #aiResponseContainer {
            margin-top: 35px;
            margin-bottom: 45px;
        }
        #aiText {
            max-height: none;
            overflow: visible;
            white-space: pre-wrap;
            line-height: 1.8;
            font-size: 1.05rem;
        }
        #postGameControls {
            margin-top: 30px;
            flex-wrap: wrap;
        }
        #canvasContainer {
            flex-shrink: 0;
            touch-action: none;
        }
        .pop-in {
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes popIn {
            from { opacity: 0; transform: scale(0.95) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
    </style>
</head>
<body class="flex flex-col items-center py-8 px-4 text-slate-800">
    
    <main class="w-full max-w-xl flex flex-col items-center">
        
        <h1 class="text-3xl font-black text-green-600 mb-2 text-center tracking-tight">10-Second Sketch</h1>
        <p class="text-slate-500 font-bold mb-8 text-center uppercase tracking-widest text-xs">Draw fast. Let AI judge.</p>

        <div id="gameHeader" class="w-full flex justify-between items-end mb-3 hidden">
            <div class="flex flex-col">
                <span class="text-xs font-bold text-slate-400 uppercase tracking-widest">Draw</span>
                <span id="promptText" class="text-xl font-black text-green-600"></span>
            </div>
            <div class="flex flex-col items-end">
                <span class="text-xs font-bold text-slate-400 uppercase tracking-widest">Time</span>
                <span id="timeText" class="text-3xl font-black text-slate-800 tabular-nums">10.0</span>
            </div>
        </div>

        <div id="canvasContainer" class="relative w-full aspect-square bg-white rounded-3xl shadow-xl border-4 border-green-100 overflow-hidden">
            <canvas id="canvas" class="absolute inset-0 w-full h-full cursor-crosshair"></canvas>
            
            <div id="startOverlay" class="absolute inset-0 bg-white/80 backdrop-blur-sm flex flex-col items-center justify-center">
                <button id="startBtn" class="bg-green-500 hover:bg-green-600 text-white font-black py-4 px-8 rounded-2xl shadow-lg transition-transform hover:scale-105 active:scale-95 text-xl tracking-wide">
                    Start Challenge
                </button>
            </div>
            
            <div id="lockOverlay" class="absolute inset-0 bg-slate-900/10 backdrop-blur-sm hidden flex-col items-center justify-center">
                <div class="bg-white px-8 py-4 rounded-2xl font-black text-slate-700 shadow-xl text-xl tracking-wide">
                    ⏱️ Time's Up!
                </div>
            </div>
        </div>

        <div id="postGameControls" class="w-full hidden flex-col gap-3 mt-6">
            <button id="aiGuessBtn" class="w-full bg-indigo-500 hover:bg-indigo-600 text-white font-black py-4 px-6 rounded-2xl shadow-md transition-colors text-lg tracking-wide">
                🤖 Submit to AI Judge
            </button>
            <div class="w-full flex gap-3">
                <button id="downloadBtn" class="flex-1 bg-green-500 hover:bg-green-600 text-white font-bold py-4 px-6 rounded-2xl shadow-md transition-colors">
                    💾 Save Card
                </button>
                <button id="restartBtn" class="flex-1 bg-white hover:bg-slate-50 text-slate-700 border-2 border-slate-200 font-bold py-4 px-6 rounded-2xl shadow-sm transition-colors">
                    🔄 Retry
                </button>
            </div>
        </div>

        <div id="aiResponseContainer" class="w-full mt-8 mb-12 hidden pop-in">
            <div class="bg-indigo-50 border-2 border-indigo-100 rounded-3xl p-6 md:p-8 relative">
                
                <div class="absolute -top-4 left-6 bg-indigo-500 text-white text-xs font-black px-4 py-2 rounded-full uppercase tracking-widest shadow-sm">
                    🤖 AI Judge
                </div>

                <div id="aiLoading" class="hidden flex-col items-center text-indigo-400 font-bold py-8 text-center gap-4">
                    <div class="text-4xl animate-pulse">🎨</div>
                    The judge is examining your masterpiece...
                </div>

                <div id="aiResultContent" class="hidden flex-col">
                    <div id="aiScore" class="text-center mb-6">
                        <div class="text-xs uppercase tracking-widest font-black text-indigo-400">Your artistic score</div>
                        <div id="aiScoreValue" class="text-7xl font-black text-indigo-600 my-2 tracking-tighter">--/10</div>
                        <div id="aiScoreLabel" class="text-sm font-bold text-indigo-400">Certified masterpiece?</div>
                    </div>
                    <div id="aiText" class="text-slate-700 leading-relaxed font-medium"></div>
                </div>

            </div>
        </div>

    </main>

    <script>
        const prompts = ["A bicycle", "A confused cat", "A smartphone", "A coffee cup", "A haunted house", "An astronaut", "A slice of pizza", "A luxury car", "A sword", "A gaming controller"];
        
        let currentPrompt = "";
        let timeLeft = 10.0;
        let timerInterval = null;
        let isDrawing = false;
        let gameActive = false;
        let currentRating = null;
        let currentReview = "";
        let ratingIsProvisional = false;

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const startBtn = document.getElementById('startBtn');
        const startOverlay = document.getElementById('startOverlay');
        const lockOverlay = document.getElementById('lockOverlay');
        const gameHeader = document.getElementById('gameHeader');
        const promptText = document.getElementById('promptText');
        const timeText = document.getElementById('timeText');
        const postGameControls = document.getElementById('postGameControls');
        const aiGuessBtn = document.getElementById('aiGuessBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const restartBtn = document.getElementById('restartBtn');
        const aiResponseContainer = document.getElementById('aiResponseContainer');
        const aiLoading = document.getElementById('aiLoading');
        const aiResultContent = document.getElementById('aiResultContent');
        const aiScoreValue = document.getElementById('aiScoreValue');
        const aiScoreLabel = document.getElementById('aiScoreLabel');
        const aiText = document.getElementById('aiText');

        function resizeCanvas() {
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.lineWidth = 6;
            ctx.strokeStyle = '#0f172a';
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function startGame() {
            startOverlay.classList.add('hidden');
            lockOverlay.classList.add('hidden');
            gameHeader.classList.remove('hidden');
            gameHeader.classList.add('flex');
            postGameControls.classList.add('hidden');
            postGameControls.classList.remove('flex');
            aiResponseContainer.classList.add('hidden');
            
            resizeCanvas();
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            currentPrompt = prompts[Math.floor(Math.random() * prompts.length)];
            promptText.textContent = currentPrompt;
            
            timeLeft = 10.0;
            timeText.textContent = "10.0";
            timeText.classList.remove('text-red-500');
            
            gameActive = true;
            
            timerInterval = setInterval(() => {
                timeLeft -= 0.1;
                if (timeLeft <= 0) {
                    timeLeft = 0;
                    endGame();
                }
                timeText.textContent = timeLeft.toFixed(1);
                if (timeLeft <= 3) timeText.classList.add('text-red-500');
            }, 100);
        }

        function endGame() {
            clearInterval(timerInterval);
            gameActive = false;
            isDrawing = false;
            lockOverlay.classList.remove('hidden');
            lockOverlay.classList.add('flex');
            postGameControls.classList.remove('hidden');
            postGameControls.classList.add('flex');
        }

        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return { x: clientX - rect.left, y: clientY - rect.top };
        }

        function startPosition(e) {
            if (!gameActive) return;
            e.preventDefault();
            isDrawing = true;
            const pos = getPos(e);
            ctx.beginPath();
            ctx.moveTo(pos.x, pos.y);
        }

        function endPosition() {
            isDrawing = false;
            ctx.beginPath();
        }

        function draw(e) {
            if (!isDrawing || !gameActive) return;
            e.preventDefault();
            const pos = getPos(e);
            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(pos.x, pos.y);
        }

        canvas.addEventListener('mousedown', startPosition);
        canvas.addEventListener('mouseup', endPosition);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('touchstart', startPosition, { passive: false });
        canvas.addEventListener('touchend', endPosition);
        canvas.addEventListener('touchmove', draw, { passive: false });

        startBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('click', startGame);

        function getRatingLabel(score) {
            if (score >= 9) return "🏆 Legendary masterpiece!";
            if (score >= 8) return "🌟 Absolutely fantastic!";
            if (score >= 7) return "🎨 Pretty impressive!";
            if (score >= 5) return "😎 Not bad, not bad!";
            if (score >= 3) return "😂 Beautifully questionable!";
            return "💀 The judge needs a moment...";
        }

        async function letAIGuess() {
            aiGuessBtn.disabled = true;
            aiGuessBtn.classList.add('opacity-50', 'cursor-not-allowed');
            aiResponseContainer.classList.remove('hidden');
            aiLoading.classList.remove('hidden');
            aiLoading.classList.add('flex');
            aiResultContent.classList.add('hidden');
            aiResultContent.classList.remove('flex');
            
            currentRating = null;
            currentReview = "";
            ratingIsProvisional = false;

            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = canvas.width;
            tempCanvas.height = canvas.height;
            const tCtx = tempCanvas.getContext('2d');
            tCtx.fillStyle = '#ffffff';
            tCtx.fillRect(0, 0, tempCanvas.width, tempCanvas.height);
            tCtx.drawImage(canvas, 0, 0);
            
            const base64Data = tempCanvas.toDataURL("image/png").split(",")[1];

            try {
                const response = await fetch("/api/judge", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ image: base64Data, prompt: currentPrompt })
                });

                if (!response.ok) throw new Error("API Error");
                const result = await response.json();
                
                currentRating = Math.round(result.rating * 10) / 10;
                let review = result.commentary;

                if (currentPrompt) {
                    const escaped = currentPrompt.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
                    review = review.replace(new RegExp(escaped, "gi"), "[REDACTED]");
                }
                currentReview = review;

            } catch (error) {
                currentRating = 5;
                currentReview = "The AI judge couldn't connect right now! You get a temporary score.";
                ratingIsProvisional = true;
            }

            aiScoreValue.textContent = `${currentRating}/10`;
            aiScoreLabel.textContent = ratingIsProvisional ? "⏳ Provisional score" : getRatingLabel(currentRating);
            aiText.textContent = currentReview;
            
            aiLoading.classList.add('hidden');
            aiLoading.classList.remove('flex');
            aiResultContent.classList.remove('hidden');
            aiResultContent.classList.add('flex');
            
            aiGuessBtn.disabled = false;
            aiGuessBtn.classList.remove('opacity-50', 'cursor-not-allowed');
        }

        aiGuessBtn.addEventListener('click', letAIGuess);

        function roundedBox(ctx, x, y, w, h, radius, color) {
            ctx.beginPath();
            ctx.roundRect(x, y, w, h, radius);
            ctx.fillStyle = color;
            ctx.fill();
        }

        async function downloadCanvas() {
            if (currentRating === null) await letAIGuess();

            const output = document.createElement("canvas");
            const oCtx = output.getContext("2d");
            output.width = 1200;
            output.height = 1150;

            oCtx.fillStyle = "#f0fdf4";
            oCtx.fillRect(0, 0, output.width, output.height);

            for (let x = 20; x < 1200; x += 40) {
                for (let y = 20; y < 1150; y += 40) {
                    oCtx.fillStyle = "#bbf7d0";
                    oCtx.beginPath();
                    oCtx.arc(x, y, 2, 0, Math.PI * 2);
                    oCtx.fill();
                }
            }

            roundedBox(oCtx, 55, 45, 1090, 1060, 35, "#ffffff");

            oCtx.textAlign = "center";
            oCtx.fillStyle = "#16a34a";
            oCtx.font = "900 65px Nunito, sans-serif";
            oCtx.fillText("GUESS WHAT I DREW?!", 600, 140);

            oCtx.fillStyle = "#64748b";
            oCtx.font = "700 27px Nunito, sans-serif";
            oCtx.fillText("⏱️ THE 10-SECOND SKETCH CHALLENGE", 600, 190);

            roundedBox(oCtx, 105, 230, 990, 580, 20, "#f8fafc");
            
            oCtx.strokeStyle = "#e2e8f0";
            oCtx.lineWidth = 4;
            oCtx.strokeRect(105, 230, 990, 580);

            const padding = 25;
            const scale = Math.min((990 - padding * 2) / canvas.width, (580 - padding * 2) / canvas.height);
            const drawWidth = canvas.width * scale;
            const drawHeight = canvas.height * scale;

            const tempForExport = document.createElement('canvas');
            tempForExport.width = canvas.width;
            tempForExport.height = canvas.height;
            const teCtx = tempForExport.getContext('2d');
            teCtx.fillStyle = '#ffffff';
            teCtx.fillRect(0, 0, tempForExport.width, tempForExport.height);
            teCtx.drawImage(canvas, 0, 0);

            oCtx.drawImage(tempForExport, 600 - drawWidth / 2, 520 - drawHeight / 2, drawWidth, drawHeight);

            roundedBox(oCtx, 105, 835, 990, 155, 22, "#eef2ff");

            oCtx.fillStyle = "#6366f1";
            oCtx.font = "900 27px Nunito, sans-serif";
            oCtx.fillText(ratingIsProvisional ? "PROVISIONAL SCORE" : "🤖 AI JUDGE RATING", 600, 885);

            oCtx.fillStyle = "#4338ca";
            oCtx.font = "900 65px Nunito, sans-serif";
            oCtx.fillText(`${currentRating}/10`, 600, 955);

            oCtx.fillStyle = "#334155";
            oCtx.font = "900 25px Nunito, sans-serif";
            oCtx.fillText("🎨 Made in 10 seconds. Remembered forever.", 600, 1035);

            oCtx.fillStyle = "#16a34a";
            oCtx.font = "700 19px Nunito, sans-serif";
            oCtx.fillText(`Try the challenge yourself: ${window.location.origin}`, 600, 1070);

            const link = document.createElement("a");
            link.download = "my-10-second-masterpiece.png";
            link.href = output.toDataURL("image/png");
            link.click();
        }

        downloadBtn.addEventListener('click', downloadCanvas);
    </script>
</body>
</html>
