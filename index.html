<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>10-Second Sketch</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://js.puter.com/v2/"></script>
    <style>
        body {
            background-color: #0a0a0a;
            color: #f5f5f5;
            font-family: 'Inter', sans-serif;
            overscroll-behavior-y: contain;
            touch-action: pan-x pan-y;
        }
        #canvas {
            touch-action: none;
            cursor: crosshair;
        }
        .pop-in {
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes popIn {
            from { opacity: 0; transform: scale(0.95) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center py-8 px-4 overflow-x-hidden selection:bg-neutral-800">

    <div class="w-full max-w-lg flex flex-col items-center">
        
        <div class="flex items-center gap-3 mb-8">
            <i data-lucide="pen-tool" class="w-6 h-6 text-neutral-400"></i>
            <h1 class="text-xl font-bold tracking-widest uppercase text-neutral-200">Sketch.</h1>
        </div>

        <div id="setupScreen" class="w-full flex flex-col items-center gap-6">
            <div class="w-full bg-neutral-900 border border-neutral-800 rounded-xl p-8 text-center flex flex-col items-center gap-4">
                <i data-lucide="timer" class="w-8 h-8 text-neutral-500"></i>
                <h2 class="text-lg font-medium text-neutral-300">10 Seconds. 1 Prompt.</h2>
                <p class="text-sm text-neutral-500 max-w-xs">Draw as fast as you can. The AI will judge your creation.</p>
                <button id="startBtn" class="mt-4 bg-neutral-100 text-neutral-950 px-8 py-3 rounded-lg font-semibold tracking-wide hover:bg-neutral-300 transition-all flex items-center gap-2">
                    <i data-lucide="play" class="w-4 h-4"></i>
                    Start Challenge
                </button>
            </div>
        </div>

        <div id="gameScreen" class="w-full hidden flex-col items-center gap-4">
            <div class="w-full flex justify-between items-end px-2">
                <div class="flex flex-col">
                    <span class="text-xs font-semibold text-neutral-500 uppercase tracking-wider">Prompt</span>
                    <span id="promptText" class="text-lg font-bold text-neutral-100"></span>
                </div>
                <div class="flex flex-col items-end">
                    <span class="text-xs font-semibold text-neutral-500 uppercase tracking-wider">Time</span>
                    <span id="timeText" class="text-2xl font-black text-neutral-100 tabular-nums">10.0</span>
                </div>
            </div>

            <div class="relative w-full aspect-square bg-neutral-900 border-2 border-neutral-800 rounded-xl overflow-hidden shadow-2xl">
                <canvas id="canvas" class="absolute inset-0 w-full h-full bg-neutral-900"></canvas>
                <div id="overlay" class="absolute inset-0 bg-neutral-950/80 backdrop-blur-sm hidden flex-col items-center justify-center gap-4">
                    <i data-lucide="lock" class="w-8 h-8 text-neutral-400"></i>
                    <span class="text-neutral-200 font-medium tracking-wide">Canvas Locked</span>
                </div>
            </div>

            <div id="postGameControls" class="w-full hidden grid-cols-2 gap-3 mt-2">
                <button id="aiGuessBtn" class="col-span-2 bg-neutral-100 text-neutral-950 p-4 rounded-xl font-semibold hover:bg-neutral-300 transition-all flex items-center justify-center gap-2">
                    <i data-lucide="cpu" class="w-5 h-5"></i>
                    Submit to AI Judge
                </button>
                <button id="downloadBtn" class="bg-neutral-900 border border-neutral-800 text-neutral-300 p-4 rounded-xl font-medium hover:bg-neutral-800 transition-all flex items-center justify-center gap-2">
                    <i data-lucide="download" class="w-4 h-4"></i>
                    Save Card
                </button>
                <button id="restartBtn" class="bg-neutral-900 border border-neutral-800 text-neutral-300 p-4 rounded-xl font-medium hover:bg-neutral-800 transition-all flex items-center justify-center gap-2">
                    <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
                    Retry
                </button>
            </div>
        </div>

        <div id="aiResponseContainer" class="w-full mt-6 hidden pop-in">
            <div class="bg-neutral-900 border border-neutral-800 rounded-xl p-6 relative">
                
                <div id="aiLoading" class="hidden flex flex-col items-center justify-center py-6 gap-4">
                    <i data-lucide="loader-2" class="w-6 h-6 text-neutral-500 animate-spin"></i>
                    <span class="text-sm font-medium text-neutral-400 tracking-wide">Analyzing geometry...</span>
                </div>

                <div id="aiResultContent" class="hidden flex flex-col items-center text-center">
                    <span class="text-xs font-bold text-neutral-500 uppercase tracking-widest mb-2">Final Score</span>
                    <span id="aiScoreValue" class="text-6xl font-black text-neutral-100 mb-6 tracking-tighter"></span>
                    <p id="aiText" class="text-sm text-neutral-300 leading-relaxed font-medium px-2"></p>
                </div>

            </div>
        </div>

    </div>

    <script>
        lucide.createIcons();

        const prompts = [
            "A bicycle", "A confused cat", "A smartphone", "A coffee cup", 
            "A haunted house", "An astronaut", "A slice of pizza", 
            "A luxury car", "A sword", "A gaming controller"
        ];

        let currentPrompt = "";
        let timeLeft = 10.0;
        let timerInterval = null;
        let isDrawing = false;
        let gameActive = false;
        let currentRating = null;
        let currentReview = "";

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const setupScreen = document.getElementById('setupScreen');
        const gameScreen = document.getElementById('gameScreen');
        const promptText = document.getElementById('promptText');
        const timeText = document.getElementById('timeText');
        const overlay = document.getElementById('overlay');
        const postGameControls = document.getElementById('postGameControls');
        const aiResponseContainer = document.getElementById('aiResponseContainer');
        const aiLoading = document.getElementById('aiLoading');
        const aiResultContent = document.getElementById('aiResultContent');
        const aiScoreValue = document.getElementById('aiScoreValue');
        const aiText = document.getElementById('aiText');
        
        const startBtn = document.getElementById('startBtn');
        const aiGuessBtn = document.getElementById('aiGuessBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const restartBtn = document.getElementById('restartBtn');

        function resizeCanvas() {
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.lineWidth = 4;
            ctx.strokeStyle = '#f5f5f5';
        }

        window.addEventListener('resize', resizeCanvas);

        function startGame() {
            setupScreen.classList.add('hidden');
            gameScreen.classList.remove('hidden');
            gameScreen.classList.add('flex');
            
            resizeCanvas();
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            currentPrompt = prompts[Math.floor(Math.random() * prompts.length)];
            promptText.textContent = currentPrompt;
            
            timeLeft = 10.0;
            timeText.textContent = timeLeft.toFixed(1);
            timeText.classList.remove('text-red-500');
            
            overlay.classList.add('hidden');
            postGameControls.classList.add('hidden');
            aiResponseContainer.classList.add('hidden');
            postGameControls.classList.remove('grid');
            
            gameActive = true;
            
            timerInterval = setInterval(() => {
                timeLeft -= 0.1;
                if (timeLeft <= 0) {
                    timeLeft = 0;
                    endGame();
                }
                timeText.textContent = timeLeft.toFixed(1);
                if (timeLeft <= 3) timeText.classList.add('text-red-500');
            }, 100);
        }

        function endGame() {
            clearInterval(timerInterval);
            gameActive = false;
            isDrawing = false;
            overlay.classList.remove('hidden');
            overlay.classList.add('flex');
            postGameControls.classList.remove('hidden');
            postGameControls.classList.add('grid');
        }

        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return { x: clientX - rect.left, y: clientY - rect.top };
        }

        function startPosition(e) {
            if (!gameActive) return;
            e.preventDefault();
            isDrawing = true;
            const pos = getPos(e);
            ctx.beginPath();
            ctx.moveTo(pos.x, pos.y);
        }

        function endPosition() {
            isDrawing = false;
            ctx.beginPath();
        }

        function draw(e) {
            if (!isDrawing || !gameActive) return;
            e.preventDefault();
            const pos = getPos(e);
            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(pos.x, pos.y);
        }

        canvas.addEventListener('mousedown', startPosition);
        canvas.addEventListener('mouseup', endPosition);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('touchstart', startPosition, { passive: false });
        canvas.addEventListener('touchend', endPosition);
        canvas.addEventListener('touchmove', draw, { passive: false });

        startBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('click', startGame);

        async function letAIGuess() {
            aiGuessBtn.disabled = true;
            aiGuessBtn.classList.add('opacity-50', 'cursor-not-allowed');
            aiResponseContainer.classList.remove('hidden');
            aiLoading.classList.remove('hidden');
            aiLoading.classList.add('flex');
            aiResultContent.classList.add('hidden');
            
            currentRating = null;
            currentReview = "";

            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = canvas.width;
            tempCanvas.height = canvas.height;
            const tCtx = tempCanvas.getContext('2d');
            tCtx.fillStyle = '#0a0a0a';
            tCtx.fillRect(0, 0, tempCanvas.width, tempCanvas.height);
            tCtx.drawImage(canvas, 0, 0);
            
            const base64Data = tempCanvas.toDataURL("image/png").split(",")[1];

            try {
                const response = await fetch("/api/judge", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ image: base64Data, prompt: currentPrompt })
                });

                if (!response.ok) throw new Error("API Error");
                const result = await response.json();
                
                currentRating = Math.round(result.rating * 10) / 10;
                currentReview = result.commentary;

            } catch (error) {
                try {
                    const puterResponse = await puter.ai.chat(
                        `Secret prompt: ${currentPrompt}. Judge this drawing on a scale of 0-10. Return valid JSON only with keys "rating" and "commentary". Be sarcastic.`,
                        { image: `data:image/png;base64,${base64Data}` }
                    );
                    
                    const cleaned = puterResponse.toString().replace(/```json/gi, "").replace(/```/g, "").trim();
                    const start = cleaned.indexOf("{");
                    const end = cleaned.lastIndexOf("}");
                    const parsed = JSON.parse(cleaned.slice(start, end + 1));
                    
                    currentRating = parsed.rating;
                    currentReview = parsed.commentary;
                } catch (fallbackError) {
                    currentRating = 0;
                    currentReview = "Connection failed. The servers refuse to process this drawing.";
                }
            }

            if (currentPrompt) {
                const escaped = currentPrompt.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
                currentReview = currentReview.replace(new RegExp(escaped, "gi"), "[REDACTED]");
            }

            aiScoreValue.textContent = `${currentRating}/10`;
            aiText.textContent = currentReview;
            
            aiLoading.classList.add('hidden');
            aiLoading.classList.remove('flex');
            aiResultContent.classList.remove('hidden');
            aiResultContent.classList.add('flex');
            
            aiGuessBtn.disabled = false;
            aiGuessBtn.classList.remove('opacity-50', 'cursor-not-allowed');
        }

        aiGuessBtn.addEventListener('click', letAIGuess);

        function roundedBox(ctx, x, y, w, h, radius, color) {
            ctx.beginPath();
            ctx.roundRect(x, y, w, h, radius);
            ctx.fillStyle = color;
            ctx.fill();
        }

        async function downloadCanvas() {
            if (currentRating === null) await letAIGuess();

            const output = document.createElement("canvas");
            const oCtx = output.getContext("2d");
            output.width = 1080;
            output.height = 1080;

            oCtx.fillStyle = "#0a0a0a";
            oCtx.fillRect(0, 0, output.width, output.height);

            for (let x = 20; x < 1080; x += 40) {
                for (let y = 20; y < 1080; y += 40) {
                    oCtx.fillStyle = "#171717";
                    oCtx.beginPath();
                    oCtx.arc(x, y, 2, 0, Math.PI * 2);
                    oCtx.fill();
                }
            }

            roundedBox(oCtx, 40, 40, 1000, 1000, 40, "#121212");
            
            oCtx.strokeStyle = "#262626";
            oCtx.lineWidth = 2;
            oCtx.strokeRect(40, 40, 1000, 1000);

            oCtx.textAlign = "center";
            oCtx.fillStyle = "#f5f5f5";
            oCtx.font = "900 48px Inter, sans-serif";
            oCtx.fillText("GUESS WHAT I DREW", 540, 140);

            oCtx.fillStyle = "#737373";
            oCtx.font = "600 24px Inter, sans-serif";
            oCtx.fillText("10 SECOND SKETCH CHALLENGE", 540, 185);

            roundedBox(oCtx, 140, 240, 800, 500, 24, "#0a0a0a");
            
            const scale = Math.min(760 / canvas.width, 460 / canvas.height);
            const dW = canvas.width * scale;
            const dH = canvas.height * scale;
            
            const tempForExport = document.createElement('canvas');
            tempForExport.width = canvas.width;
            tempForExport.height = canvas.height;
            const teCtx = tempForExport.getContext('2d');
            teCtx.fillStyle = '#0a0a0a';
            teCtx.fillRect(0, 0, tempForExport.width, tempForExport.height);
            teCtx.drawImage(canvas, 0, 0);

            oCtx.drawImage(tempForExport, 540 - dW / 2, 490 - dH / 2, dW, dH);

            roundedBox(oCtx, 140, 780, 800, 200, 24, "#171717");

            oCtx.fillStyle = "#a3a3a3";
            oCtx.font = "800 20px Inter, sans-serif";
            oCtx.fillText("AI JUDGE SCORE", 540, 840);

            oCtx.fillStyle = "#f5f5f5";
            oCtx.font = "900 72px Inter, sans-serif";
            oCtx.fillText(`${currentRating}/10`, 540, 930);

            const link = document.createElement("a");
            link.download = "sketch-challenge.png";
            link.href = output.toDataURL("image/png");
            link.click();
        }

        downloadBtn.addEventListener('click', downloadCanvas);
    </script>
</body>
</html>
