<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>10-Second Drawing Challenge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom Fonts & Base Styles */
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap');
        
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #f0fdf4;
            background-image: radial-gradient(#bbf7d0 1px, transparent 1px);
            background-size: 20px 20px;
            overscroll-behavior-y: contain; /* Prevent pull-to-refresh on mobile */
        }

        /* Canvas Styles */
        #drawingCanvas {
            touch-action: none; /* Prevent scrolling when drawing on touch devices */
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }

        /* Animations */
        @keyframes pulse-fast {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        .animate-pulse-fast {
            animation: pulse-fast 1s infinite;
        }

        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.9) translateY(10px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
        .pop-in {
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col text-slate-800">

    <!-- Header -->
    <header class="w-full p-4 text-center">
        <h1 class="text-3xl md:text-4xl font-black text-green-600 drop-shadow-sm tracking-tight">
            ⏱️ 10-Second Sketch
        </h1>
        <p class="text-slate-500 font-bold mt-1">Ready, Set, Draw!</p>
    </header>

    <!-- Main Game Area -->
    <main class="flex-grow flex flex-col items-center w-full max-w-3xl mx-auto px-4 pb-12">
        
        <!-- Game Info Bar -->
        <div class="w-full flex justify-between items-end mb-3 px-2">
            <div class="flex flex-col">
                <span class="text-sm font-bold text-slate-400 uppercase tracking-wider">Draw:</span>
                <span id="promptDisplay" class="text-2xl md:text-3xl font-black text-slate-800 leading-none">???</span>
            </div>
            <div class="flex flex-col items-end">
                <span class="text-sm font-bold text-slate-400 uppercase tracking-wider">Time:</span>
                <span id="timerDisplay" class="text-3xl md:text-4xl font-black text-green-500 leading-none transition-colors duration-300">10s</span>
            </div>
        </div>

        <!-- Canvas Container -->
        <div class="relative w-full aspect-[4/3] md:aspect-[16/9] bg-white rounded-2xl overflow-hidden border-4 border-slate-200" id="canvasContainer">
            <canvas id="drawingCanvas" class="w-full h-full cursor-crosshair"></canvas>
            
            <!-- Start Overlay -->
            <div id="startOverlay" class="absolute inset-0 bg-white/80 backdrop-blur-sm flex flex-col items-center justify-center z-10 transition-opacity duration-300">
                <button id="startBtn" class="bg-green-500 hover:bg-green-600 text-white text-xl md:text-2xl font-black py-4 px-8 rounded-full shadow-[0_6px_0_#16a34a] hover:shadow-[0_4px_0_#16a34a] hover:translate-y-[2px] transition-all animate-pulse-fast">
                    Start Challenge!
                </button>
                <p class="mt-4 text-slate-600 font-bold text-center px-6">You will have exactly 10 seconds.<br>No undo. No eraser. Good luck.</p>
            </div>

            <!-- Ended Overlay (Subtle tint) -->
            <div id="endedOverlay" class="absolute inset-0 bg-slate-900/5 z-10 hidden pointer-events-none transition-opacity duration-300"></div>
        </div>

        <!-- Post Game Controls -->
        <div id="postGameControls" class="w-full mt-6 hidden flex-col sm:flex-row gap-4 justify-center pop-in">
            <button id="downloadBtn" class="flex-1 bg-white border-2 border-slate-200 hover:border-slate-300 text-slate-700 font-bold py-3 px-6 rounded-xl shadow-sm transition-all flex items-center justify-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" /></svg>
                Save PNG
            </button>
            <button id="aiGuessBtn" class="flex-1 bg-indigo-500 hover:bg-indigo-600 text-white font-bold py-3 px-6 rounded-xl shadow-[0_4px_0_#4338ca] hover:shadow-[0_2px_0_#4338ca] hover:translate-y-[2px] transition-all flex items-center justify-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"/></svg>
                Let AI Judge
            </button>
            <button id="restartBtn" class="flex-1 bg-slate-800 hover:bg-slate-900 text-white font-bold py-3 px-6 rounded-xl shadow-[0_4px_0_#0f172a] hover:shadow-[0_2px_0_#0f172a] hover:translate-y-[2px] transition-all flex items-center justify-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>
                Play Again
            </button>
        </div>

        <!-- AI Response Box -->
        <div id="aiResponseContainer" class="w-full mt-6 hidden pop-in">
            <div class="bg-indigo-50 border-2 border-indigo-100 rounded-2xl p-6 md:p-8 relative w-full">
                
                <div class="absolute -top-3 left-6 bg-indigo-500 text-white text-xs font-bold px-4 py-1 rounded-full uppercase tracking-wide shadow-sm">
                    🤖 AI Judge
                </div>

                <div id="aiLoading" class="hidden flex-col items-center text-indigo-400 font-bold py-8 text-center gap-4 animate-pulse">
                    <div class="text-5xl">🎨</div>
                    The judge is examining your masterpiece...
                </div>

                <div id="aiResultContent" class="hidden flex-col">
                    <div id="aiScore" class="text-center mb-6">
                        <div class="text-xs uppercase tracking-widest font-black text-indigo-400">Your artistic score</div>
                        <div id="aiScoreValue" class="text-6xl md:text-7xl font-black text-indigo-600 my-2 tracking-tighter">--/10</div>
                        <div id="aiScoreLabel" class="text-sm font-bold text-indigo-400">Certified masterpiece?</div>
                    </div>
                    
                    <!-- Box expands freely now to fit the text -->
                    <div id="aiText" class="text-slate-700 text-[1.05rem] leading-relaxed font-medium">
                        <!-- AI response goes here -->
                    </div>
                </div>

            </div>
        </div>

    </main>

    <script>
        /**
         * 10-Second Drawing Challenge Logic
         */
        const prompts = [
            "a bicycle", "a grumpy cat", "a hotdog", "an alien spaceship", 
            "a snowman", "a guitar", "a pair of scissors", "a slice of pizza", 
            "a coffee mug", "a palm tree", "a pineapple", "a spider", 
            "a wizard hat", "a turtle", "a ghost", "a hamburger"
        ];

        // State
        let currentPrompt = "";
        let timeLeft = 10;
        let timerInterval = null;
        let isDrawing = false;
        let gameState = 'initial';
        
        let currentRating = null;
        let currentReview = "";
        let ratingIsProvisional = false;
        
        // DOM Elements
        const canvas = document.getElementById('drawingCanvas');
        const ctx = canvas.getContext('2d');
        const canvasContainer = document.getElementById('canvasContainer');
        const promptDisplay = document.getElementById('promptDisplay');
        const timerDisplay = document.getElementById('timerDisplay');
        
        const startOverlay = document.getElementById('startOverlay');
        const endedOverlay = document.getElementById('endedOverlay');
        
        const startBtn = document.getElementById('startBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const aiGuessBtn = document.getElementById('aiGuessBtn');
        const restartBtn = document.getElementById('restartBtn');
        const postGameControls = document.getElementById('postGameControls');
        
        const aiResponseContainer = document.getElementById('aiResponseContainer');
        const aiLoading = document.getElementById('aiLoading');
        const aiResultContent = document.getElementById('aiResultContent');
        const aiScoreValue = document.getElementById('aiScoreValue');
        const aiScoreLabel = document.getElementById('aiScoreLabel');
        const aiText = document.getElementById('aiText');

        // --- Canvas Setup & Drawing Logic ---

        function resizeCanvas() {
            const rect = canvasContainer.getBoundingClientRect();
            
            if (gameState !== 'playing') {
                canvas.width = rect.width;
                canvas.height = rect.height;
                
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.lineWidth = 6;
                ctx.strokeStyle = '#0f172a'; 
                
                fillWhiteBackground();
            }
        }

        function fillWhiteBackground() {
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        window.addEventListener('resize', resizeCanvas);

        function getCoordinates(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            
            return {
                x: (clientX - rect.left) * (canvas.width / rect.width),
                y: (clientY - rect.top) * (canvas.height / rect.height)
            };
        }

        function startDrawing(e) {
            if (gameState !== 'playing') return;
            e.preventDefault();
            isDrawing = true;
            const { x, y } = getCoordinates(e);
            ctx.beginPath();
            ctx.moveTo(x, y);
        }

        function draw(e) {
            if (!isDrawing || gameState !== 'playing') return;
            e.preventDefault();
            const { x, y } = getCoordinates(e);
            ctx.lineTo(x, y);
            ctx.stroke();
        }

        function stopDrawing(e) {
            if (!isDrawing) return;
            e.preventDefault();
            isDrawing = false;
            ctx.closePath();
        }

        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mouseout', stopDrawing);

        canvas.addEventListener('touchstart', startDrawing, { passive: false });
        canvas.addEventListener('touchmove', draw, { passive: false });
        canvas.addEventListener('touchend', stopDrawing, { passive: false });

        // --- Game Flow Logic ---

        function pickRandomPrompt() {
            const index = Math.floor(Math.random() * prompts.length);
            return prompts[index];
        }

        function initGame() {
            resizeCanvas();
            currentPrompt = pickRandomPrompt();
            promptDisplay.textContent = currentPrompt;
            timeLeft = 10;
            updateTimerDisplay();
            
            gameState = 'initial';
            currentRating = null;
            currentReview = "";
            ratingIsProvisional = false;
            
            startOverlay.classList.remove('hidden');
            endedOverlay.classList.add('hidden');
            postGameControls.classList.add('hidden');
            postGameControls.classList.remove('flex');
            
            aiResponseContainer.classList.add('hidden');
            aiResultContent.classList.add('hidden');
            aiResultContent.classList.remove('flex');
            
            timerDisplay.classList.remove('text-red-500', 'animate-pulse');
            timerDisplay.classList.add('text-green-500');
            canvas.classList.add('cursor-crosshair');
            canvas.classList.remove('cursor-not-allowed');
        }

        function startGame() {
            gameState = 'playing';
            startOverlay.classList.add('hidden');
            fillWhiteBackground(); 
            
            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimerDisplay();
                
                if (timeLeft <= 3) {
                    timerDisplay.classList.remove('text-green-500');
                    timerDisplay.classList.add('text-red-500', 'animate-pulse');
                }
                
                if (timeLeft <= 0) {
                    endGame();
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            timerDisplay.textContent = `${timeLeft}s`;
        }

        function endGame() {
            clearInterval(timerInterval);
            gameState = 'ended';
            isDrawing = false;
            
            endedOverlay.classList.remove('hidden');
            canvas.classList.remove('cursor-crosshair');
            canvas.classList.add('cursor-not-allowed');
            timerDisplay.classList.remove('animate-pulse');
            
            postGameControls.classList.remove('hidden');
            postGameControls.classList.add('flex');
        }

        // --- Post Game Actions ---

        function getRatingLabel(score) {
            if (score >= 9) return "🏆 Legendary masterpiece!";
            if (score >= 8) return "🌟 Absolutely fantastic!";
            if (score >= 7) return "🎨 Pretty impressive!";
            if (score >= 5) return "😎 Not bad, not bad!";
            if (score >= 3) return "😂 Beautifully questionable!";
            return "💀 The judge needs a moment...";
        }

        async function letAIGuess() {
            aiGuessBtn.disabled = true;
            aiGuessBtn.classList.add('opacity-50', 'cursor-not-allowed');
            
            aiResponseContainer.classList.remove('hidden');
            aiLoading.classList.remove('hidden');
            aiLoading.classList.add('flex');
            
            aiResultContent.classList.add('hidden');
            aiResultContent.classList.remove('flex');
            
            currentRating = null;
            currentReview = "";
            ratingIsProvisional = false;

            // Make sure background is perfectly white for the AI API
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = canvas.width;
            tempCanvas.height = canvas.height;
            const tCtx = tempCanvas.getContext('2d');
            tCtx.fillStyle = '#ffffff';
            tCtx.fillRect(0, 0, tempCanvas.width, tempCanvas.height);
            tCtx.drawImage(canvas, 0, 0);
            
            const base64Data = tempCanvas.toDataURL('image/png').split(',')[1];
            
            try {
                const response = await fetch("/api/judge", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ image: base64Data, prompt: currentPrompt })
                });

                if (!response.ok) throw new Error("API Error");
                const result = await response.json();
                
                currentRating = Math.round(result.rating * 10) / 10;
                let review = result.commentary;

                // Censor the actual prompt so they can't cheat on the share card
                if (currentPrompt) {
                    const escaped = currentPrompt.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
                    review = review.replace(new RegExp(escaped, "gi"), "[REDACTED]");
                }
                currentReview = review;

            } catch (error) {
                currentRating = 5;
                currentReview = "The AI judge couldn't connect right now! The servers refuse to process this drawing. You get a temporary score.";
                ratingIsProvisional = true;
            }

            aiScoreValue.textContent = `${currentRating}/10`;
            aiScoreLabel.textContent = ratingIsProvisional ? "⏳ Provisional score" : getRatingLabel(currentRating);
            aiText.textContent = currentReview;
            
            aiLoading.classList.add('hidden');
            aiLoading.classList.remove('flex');
            
            aiResultContent.classList.remove('hidden');
            aiResultContent.classList.add('flex');
            
            aiGuessBtn.disabled = false;
            aiGuessBtn.classList.remove('opacity-50', 'cursor-not-allowed');
        }

        // Share Card Builder
        function roundedBox(ctx, x, y, w, h, radius, color) {
            ctx.beginPath();
            ctx.roundRect(x, y, w, h, radius);
            ctx.fillStyle = color;
            ctx.fill();
        }

        async function downloadCanvas() {
            if (currentRating === null) {
                await letAIGuess();
            }

            const output = document.createElement("canvas");
            const oCtx = output.getContext("2d");
            output.width = 1200;
            output.height = 1150;

            // Background
            oCtx.fillStyle = "#f0fdf4";
            oCtx.fillRect(0, 0, output.width, output.height);

            // Dots pattern
            for (let x = 20; x < 1200; x += 40) {
                for (let y = 20; y < 1150; y += 40) {
                    oCtx.fillStyle = "#bbf7d0";
                    oCtx.beginPath();
                    oCtx.arc(x, y, 2, 0, Math.PI * 2);
                    oCtx.fill();
                }
            }

            // Main White Card
            roundedBox(oCtx, 55, 45, 1090, 1060, 35, "#ffffff");

            oCtx.textAlign = "center";
            oCtx.fillStyle = "#16a34a";
            oCtx.font = "900 65px Nunito, sans-serif";
            oCtx.fillText("GUESS WHAT I DREW?!", 600, 140);

            oCtx.fillStyle = "#64748b";
            oCtx.font = "700 27px Nunito, sans-serif";
            oCtx.fillText("⏱️ THE 10-SECOND SKETCH CHALLENGE", 600, 190);

            // Drawing Area border
            roundedBox(oCtx, 105, 230, 990, 580, 20, "#f8fafc");
            
            oCtx.strokeStyle = "#e2e8f0";
            oCtx.lineWidth = 4;
            oCtx.strokeRect(105, 230, 990, 580);

            const padding = 25;
            const scale = Math.min((990 - padding * 2) / canvas.width, (580 - padding * 2) / canvas.height);
            const drawWidth = canvas.width * scale;
            const drawHeight = canvas.height * scale;

            const tempForExport = document.createElement('canvas');
            tempForExport.width = canvas.width;
            tempForExport.height = canvas.height;
            const teCtx = tempForExport.getContext('2d');
            teCtx.fillStyle = '#ffffff';
            teCtx.fillRect(0, 0, tempForExport.width, tempForExport.height);
            teCtx.drawImage(canvas, 0, 0);

            oCtx.drawImage(tempForExport, 600 - drawWidth / 2, 520 - drawHeight / 2, drawWidth, drawHeight);

            // Rating Badge
            roundedBox(oCtx, 105, 835, 990, 155, 22, "#eef2ff");

            oCtx.fillStyle = "#6366f1";
            oCtx.font = "900 27px Nunito, sans-serif";
            oCtx.fillText(ratingIsProvisional ? "PROVISIONAL SCORE" : "🤖 AI JUDGE RATING", 600, 885);

            oCtx.fillStyle = "#4338ca";
            oCtx.font = "900 65px Nunito, sans-serif";
            oCtx.fillText(`${currentRating}/10`, 600, 955);

            oCtx.fillStyle = "#334155";
            oCtx.font = "900 25px Nunito, sans-serif";
            oCtx.fillText("🎨 Made in 10 seconds. Remembered forever.", 600, 1035);

            oCtx.fillStyle = "#16a34a";
            oCtx.font = "700 19px Nunito, sans-serif";
            oCtx.fillText(`Try the challenge yourself: ${window.location.origin}`, 600, 1070);

            const link = document.createElement("a");
            link.download = `10-second-masterpiece.png`;
            link.href = output.toDataURL("image/png");
            link.click();
        }

        // Listeners
        startBtn.addEventListener('click', startGame);
        downloadBtn.addEventListener('click', downloadCanvas);
        aiGuessBtn.addEventListener('click', letAIGuess);
        restartBtn.addEventListener('click', initGame);

        window.addEventListener('load', () => {
            setTimeout(initGame, 100);
        });

    </script>
</body>
</html>
